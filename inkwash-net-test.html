<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Inkwash 通信テスト</title>
<style>
:root{--bg:#14171b;--panel:#1d2227;--fg:#e8ebee;--mute:#99a1ab;--line:#323941;--a:#ff7f45;--b:#2cc7b6;--ok:#46c47a;--bad:#ff6b63;--cv:#242a30;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Hiragino Sans","Noto Sans JP",sans-serif;padding:14px max(16px,env(safe-area-inset-right)) 14px max(16px,env(safe-area-inset-left))}
main{max-width:860px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:20px;margin:0}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input[type=text]{font:16px system-ui,sans-serif;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);min-width:0;flex:1 1 140px}
button{font:600 14px system-ui,sans-serif;padding:10px 16px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--fg);cursor:pointer}
button.main{background:var(--fg);color:var(--bg);border-color:var(--fg)}
button:disabled{opacity:.4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:14px;margin:0;color:var(--mute);letter-spacing:.04em}
.pill{font:600 12px ui-monospace,Menlo,monospace;padding:4px 10px;border-radius:99px;border:1px solid var(--line);color:var(--mute)}
.pill.ok{color:var(--ok);border-color:var(--ok)}.pill.bad{color:var(--bad);border-color:var(--bad)}
#code{font:700 32px ui-monospace,Menlo,monospace;letter-spacing:.2em}
#cv{width:100%;aspect-ratio:8/5;background:var(--cv);border-radius:10px;border:1px solid var(--line);touch-action:none;display:block}
.score{display:flex;height:10px;border-radius:5px;overflow:hidden;background:var(--line)}
.score i{display:block;height:100%}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
.cell{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.cell small{display:block;color:var(--mute);font-size:11px}
.cell b{font:600 18px ui-monospace,Menlo,monospace}
.hint{color:var(--mute);font-size:13px;line-height:1.6;margin:0}
#msg{font-size:13px;color:#e3b341;min-height:1.2em}
.req{display:flex;gap:8px;align-items:center;justify-content:space-between;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
<h1>Inkwash 通信テスト</h1>
<div id="msg"></div>

<section id="lobby" class="card">
  <h2>はじめる</h2>
  <div class="row"><input id="name" type="text" maxlength="10" placeholder="なまえ" autocomplete="off"></div>
  <div class="row"><button id="hostBtn" class="main" type="button">部屋を作る(ホスト)</button></div>
  <div class="row">
    <input id="codeIn" type="text" maxlength="6" placeholder="部屋コード6文字" autocapitalize="characters" autocomplete="off">
    <button id="joinBtn" type="button">入る</button>
  </div>
  <p class="hint">ホストが「部屋を作る」を押すと6文字のコードが出ます。リンクごと友達に送れば、開くだけでコードが入ります。足りない枠はBOTで埋めて4対4になります。</p>
</section>

<section id="game" hidden>
  <div class="row" style="justify-content:space-between;margin-bottom:10px">
    <span id="conn" class="pill">…</span>
    <div class="row">
      <span id="code" hidden></span>
      <button id="copyBtn" type="button" hidden>リンクをコピー</button>
      <button id="leaveBtn" type="button">抜ける</button>
    </div>
  </div>
  <div id="hostTools" class="card" hidden style="margin-bottom:10px">
    <h2>参加の承認</h2>
    <label class="row" style="font-size:13px"><input id="auto" type="checkbox"> 承認なしで入れる</label>
    <div id="reqs" style="display:flex;flex-direction:column;gap:6px"></div>
  </div>
  <canvas id="cv" width="800" height="500"></canvas>
  <div class="score" style="margin:10px 0"><i id="sa" style="background:var(--a);width:50%"></i><i id="sb" style="background:var(--b);width:50%"></i></div>
  <div class="grid">
    <div class="cell"><small>往復遅延 RTT</small><b id="sRtt">-</b></div>
    <div class="cell"><small>状態受信 /秒</small><b id="sRate">-</b></div>
    <div class="cell"><small>自機のズレ px</small><b id="sErr">-</b></div>
    <div class="cell"><small>人数(人+BOT)</small><b id="sN">-</b></div>
  </div>
  <p class="hint" style="margin-top:10px">移動は WASD / 矢印キー、スマホは画面をなぞります。「ズレ」は自分の画面の自機と、ホストが計算した位置との差です。</p>
</section>
</main>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(function(){
var W=800,H=500,C=20,GW=40,GH=25,SP=140,R=10,PREFIX='inkw26-';
var cv=document.getElementById('cv'),ctx=cv.getContext('2d');
function $(i){return document.getElementById(i);}
function say(t){$('msg').textContent=t||'';}
function clamp(v,a,b){return v<a?a:v>b?b:v;}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
var COL=['#ff7f45','#2cc7b6'];
var peer=null,role='none',code='',myId='me',hostConn=null,conns={};
var HS=null,hostTimer=null,view={},grid=new Uint8Array(GW*GH);
var keys={},joy={x:0,y:0},local={x:400,y:250},ghost=null,lastX=0,lastY=0,seq=0,sendT={},rttAvg=null,lastSend=0,errPx=0;
var stCnt=0,stRate=0,stMark=performance.now(),accepted=false,pending={};
try{$('name').value=localStorage.getItem('iw_name')||'P'+Math.floor(100+Math.random()*900);}catch(e){$('name').value='P'+Math.floor(100+Math.random()*900);}
if(location.hash.length>1)$('codeIn').value=location.hash.slice(1).toUpperCase().slice(0,6);
function myName(){var n=$('name').value.trim().slice(0,10)||'P';try{localStorage.setItem('iw_name',n);}catch(e){}return n;}
function genCode(){var s='ABCDEFGHJKMNPQRSTUVWXYZ23456789',c='',i;for(i=0;i<6;i++)c+=s[Math.floor(Math.random()*s.length)];return c;}
function setConn(t,ok){var e=$('conn');e.textContent=t;e.className='pill '+(ok===true?'ok':ok===false?'bad':'');}
function enter(){$('lobby').hidden=true;$('game').hidden=false;}
function leave(){
  if(hostTimer){clearInterval(hostTimer);hostTimer=null;}
  try{if(peer)peer.destroy();}catch(e){}
  peer=null;role='none';HS=null;hostConn=null;conns={};view={};ghost=null;grid.fill(0);accepted=false;
  $('lobby').hidden=false;$('game').hidden=true;$('code').hidden=true;$('copyBtn').hidden=true;$('hostTools').hidden=true;$('reqs').innerHTML='';
}
$('leaveBtn').onclick=function(){leave();say('');};

/* ---------- ホスト ---------- */
$('hostBtn').onclick=function(){
  if(!window.Peer){say('仲介サーバー用の部品を読み込めませんでした。ネット接続を確認してください。');return;}
  startHost(0);
};
function startHost(tries){
  code=genCode();myName();
  try{peer=new Peer(PREFIX+code);}catch(e){say('開始に失敗しました。');return;}
  say('部屋を作っています…');
  peer.on('open',function(){
    role='host';myId='H';say('');enter();
    $('code').hidden=false;$('code').textContent=code;$('copyBtn').hidden=false;$('hostTools').hidden=false;
    setConn('ホスト',true);
    HS={players:{},bots:[],tick:0,diffs:[],names:{}};grid.fill(0);view={};
    hostTimer=setInterval(function(){hostStep(1/30);},1000/30);
  });
  peer.on('connection',onGuestConn);
  peer.on('error',function(e){
    if(e&&e.type==='unavailable-id'&&tries<5){try{peer.destroy();}catch(_){}startHost(tries+1);return;}
    say('通信エラー: '+(e&&e.type||'unknown')+(e&&e.type==='network'?'(仲介サーバーに届きません)':''));
  });
  peer.on('disconnected',function(){setConn('仲介サーバーと切断(試合は続行)',false);try{peer.reconnect();}catch(e){}});
}
function onGuestConn(c){
  c.on('data',function(m){
    if(!m||typeof m!=='object')return;
    if(m.t==='hello'){
      if(conns[c.peer]||pending[c.peer])return;
      var nm=String(m.name||'?').slice(0,10);
      if(Object.keys(conns).length>=7){c.send({t:'no',why:'満員です'});setTimeout(function(){c.close();},300);return;}
      if($('auto').checked){admit(c,nm);}
      else{pending[c.peer]={c:c,name:nm};renderReqs();}
    }else if(m.t==='in'&&conns[c.peer]){
      var h=HS&&HS.players[c.peer];if(!h)return;
      h.ix=clamp(+m.x||0,-1,1);h.iy=clamp(+m.y||0,-1,1);h.seq=m.s|0;
    }
  });
  c.on('close',function(){drop(c.peer);});
  c.on('error',function(){drop(c.peer);});
}
function drop(id){
  delete pending[id];delete conns[id];
  if(HS&&HS.players[id]){delete HS.players[id];rebalance();}
  renderReqs();
}
function admit(c,nm){
  delete pending[c.peer];
  if(!HS)return;
  conns[c.peer]=c;
  var t=pickTeam(),s=spawn(t);
  HS.players[c.peer]={id:c.peer,x:s.x,y:s.y,team:t,bot:0,seq:0,ix:0,iy:0,name:nm};
  rebalance();
  c.send({t:'ok',you:c.peer});
  renderReqs();
}
function renderReqs(){
  var h='',k;
  for(k in pending)h+='<div class="req"><span>'+esc(pending[k].name)+' が入りたがっています</span><span class="row"><button data-ok="'+k+'" class="main" type="button">承認</button><button data-no="'+k+'" type="button">断る</button></span></div>';
  $('reqs').innerHTML=h||'<span class="hint">待っている人はいません</span>';
}
$('reqs').addEventListener('click',function(e){
  var ok=e.target.getAttribute('data-ok'),no=e.target.getAttribute('data-no');
  if(ok&&pending[ok])admit(pending[ok].c,pending[ok].name);
  if(no&&pending[no]){var c=pending[no].c;try{c.send({t:'no',why:'ホストに断られました'});}catch(_){}delete pending[no];setTimeout(function(){c.close();},300);renderReqs();}
});
$('copyBtn').onclick=function(){
  var url=location.href.split('#')[0]+'#'+code;
  var ok=function(){say('リンクをコピーしました: '+url);};
  try{navigator.clipboard.writeText(url).then(ok,function(){say('コピーできません。次を手で送ってください: '+url);});}
  catch(e){say('コピーできません。次を手で送ってください: '+url);}
};
function humanCount(t){var n=0,k;for(k in HS.players)if(HS.players[k].team===t)n++;return n;}
function pickTeam(){return humanCount(0)<=humanCount(1)?0:1;}
function spawn(t){return{x:t===0?60:W-60,y:60+Math.random()*(H-120)};}
function rebalance(){
  var t;
  for(t=0;t<2;t++){
    var need=Math.max(0,4-humanCount(t));
    var have=HS.bots.filter(function(b){return b.team===t;});
    while(have.length>need){var b=have.pop();HS.bots.splice(HS.bots.indexOf(b),1);}
    while(have.length<need){var s=spawn(t);var nb={id:'bot'+t+'_'+Math.floor(Math.random()*1e6),x:s.x,y:s.y,team:t,bot:1,name:'BOT',tx:s.x,ty:s.y,wait:0};HS.bots.push(nb);have.push(nb);}
  }
}
function paintAt(o){
  var i=clamp(Math.floor(o.x/C),0,GW-1),j=clamp(Math.floor(o.y/C),0,GH-1),idx=j*GW+i,v=o.team+1;
  if(grid[idx]!==v){grid[idx]=v;HS.diffs.push(idx*3+v);}
}
function hostStep(dt){
  var k,i,h;
  if(!HS.players.H){var t=pickTeam(),s=spawn(t);HS.players.H={id:'H',x:s.x,y:s.y,team:t,bot:0,seq:0,ix:0,iy:0,name:myName()};rebalance();}
  HS.players.H.ix=lastX;HS.players.H.iy=lastY;
  for(k in HS.players){h=HS.players[k];
    var l=Math.hypot(h.ix,h.iy),sc=l>1?1/l:1;
    h.x=clamp(h.x+h.ix*sc*SP*dt,R,W-R);h.y=clamp(h.y+h.iy*sc*SP*dt,R,H-R);paintAt(h);
  }
  for(i=0;i<HS.bots.length;i++){var b=HS.bots[i];
    b.wait-=dt;
    if(b.wait<=0||Math.hypot(b.tx-b.x,b.ty-b.y)<8){b.tx=Math.random()*W;b.ty=Math.random()*H;b.wait=1.5+Math.random()*2;}
    var dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy)||1;
    b.x=clamp(b.x+dx/d*90*dt,R,W-R);b.y=clamp(b.y+dy/d*90*dt,R,H-R);paintAt(b);
  }
  HS.tick++;
  if(HS.tick%2===0){
    var arr=[],all=[];
    for(k in HS.players)all.push(HS.players[k]);
    all=all.concat(HS.bots);
    for(i=0;i<all.length;i++){var o=all[i];arr.push([o.id,Math.round(o.x),Math.round(o.y),o.team,o.name,o.seq|0,o.bot?1:0]);}
    var st={t:'st',p:arr,d:HS.diffs.slice(0,300),n:HS.tick};
    if(HS.tick%45===0)st.g=Array.prototype.join.call(grid,'');
    HS.diffs=[];
    for(k in conns){try{if(conns[k].open)conns[k].send(st);}catch(e){}}
    applyState(st,true);
  }
}

/* ---------- ゲスト ---------- */
$('joinBtn').onclick=function(){
  var c=$('codeIn').value.trim().toUpperCase();
  if(c.length!==6){say('部屋コードは6文字です。');return;}
  if(!window.Peer){say('仲介サーバー用の部品を読み込めませんでした。ネット接続を確認してください。');return;}
  code=c;myName();say('部屋を探しています…');
  try{peer=new Peer();}catch(e){say('開始に失敗しました。');return;}
  peer.on('open',function(){
    hostConn=peer.connect(PREFIX+code,{reliable:true});
    var to=setTimeout(function(){if(!accepted){say('部屋が見つかりません。コードと、ホストが部屋を作っているかを確かめてください。');leave();}},15000);
    hostConn.on('open',function(){
      role='guest';say('ホストの承認を待っています…');enter();setConn('承認待ち',null);
      hostConn.send({t:'hello',name:myName()});
    });
    hostConn.on('data',function(m){
      if(!m)return;
      if(m.t==='ok'){accepted=true;clearTimeout(to);myId=m.you;say('');setConn('接続OK',true);}
      else if(m.t==='no'){clearTimeout(to);var why=m.why||'入れませんでした';leave();say(why);}
      else if(m.t==='st'&&accepted)applyState(m,false);
    });
    hostConn.on('close',function(){if(role==='guest'){var wasOk=accepted;leave();say(wasOk?'ホストとの接続が切れました。':'つながりませんでした。');}});
    hostConn.on('error',function(){say('接続エラー');});
  });
  peer.on('error',function(e){say('通信エラー: '+(e&&e.type||'unknown')+(e&&e.type==='peer-unavailable'?'(その部屋はありません)':''));if(!accepted&&role!=='guest')leave();});
};

/* ---------- 状態の反映 ---------- */
function applyState(st,isHost){
  stCnt++;
  var keep={},i,e,id;
  for(i=0;i<st.p.length;i++){e=st.p[i];id=e[0];keep[id]=1;
    var v=view[id];if(!v)v=view[id]={x:e[1],y:e[2]};
    v.tx=e[1];v.ty=e[2];v.team=e[3];v.name=e[4];v.bot=e[6];
    if(id===myId){
      ghost={x:e[1],y:e[2]};
      if(isHost){local.x=e[1];local.y=e[2];}
      else if(e[5]&&sendT[e[5]]){
        var r=performance.now()-sendT[e[5]];rttAvg=rttAvg===null?r:rttAvg*0.8+r*0.2;
        for(var s in sendT)if(+s<=e[5])delete sendT[s];
      }
    }
  }
  for(id in view)if(!keep[id])delete view[id];
  if(st.d)for(i=0;i<st.d.length;i++){var n=st.d[i];grid[Math.floor(n/3)]=n%3;}
  if(st.g&&st.g.length===GW*GH)for(i=0;i<st.g.length;i++)grid[i]=st.g.charCodeAt(i)-48;
}

/* ---------- 入力と描画 ---------- */
window.addEventListener('keydown',function(e){keys[e.code]=true;if(e.code.indexOf('Arrow')===0&&!$('game').hidden)e.preventDefault();});
window.addEventListener('keyup',function(e){keys[e.code]=false;});
var jo=null;
cv.addEventListener('pointerdown',function(e){jo={x:e.clientX,y:e.clientY};try{cv.setPointerCapture(e.pointerId);}catch(_){}});
cv.addEventListener('pointermove',function(e){if(!jo)return;joy.x=clamp((e.clientX-jo.x)/40,-1,1);joy.y=clamp((e.clientY-jo.y)/40,-1,1);});
function endJ(){jo=null;joy.x=0;joy.y=0;}
cv.addEventListener('pointerup',endJ);cv.addEventListener('pointercancel',endJ);
function readInput(){
  var x=(keys.KeyD||keys.ArrowRight?1:0)-(keys.KeyA||keys.ArrowLeft?1:0)+joy.x;
  var y=(keys.KeyS||keys.ArrowDown?1:0)-(keys.KeyW||keys.ArrowUp?1:0)+joy.y;
  var l=Math.hypot(x,y);if(l>1){x/=l;y/=l;}
  return{x:Math.round(x*100)/100,y:Math.round(y*100)/100};
}
var last=performance.now();
function frame(now){
  var dt=Math.min(0.05,(now-last)/1000);last=now;
  var inp=readInput();
  if(role==='host'){lastX=inp.x;lastY=inp.y;}
  else if(role==='guest'&&accepted){
    local.x=clamp(local.x+inp.x*SP*dt,R,W-R);local.y=clamp(local.y+inp.y*SP*dt,R,H-R);
    var ch=inp.x!==lastX||inp.y!==lastY;
    if(hostConn&&hostConn.open&&(ch&&now-lastSend>33||now-lastSend>250)){
      seq++;sendT[seq]=now;lastSend=now;lastX=inp.x;lastY=inp.y;
      try{hostConn.send({t:'in',x:inp.x,y:inp.y,s:seq});}catch(e){}
    }
    if(ghost){errPx=Math.hypot(ghost.x-local.x,ghost.y-local.y);if(errPx>80){local.x=ghost.x;local.y=ghost.y;}}
  }
  if(!$('game').hidden)draw(dt);
  if(now-stMark>1000){stRate=stCnt*1000/(now-stMark);stCnt=0;stMark=now;stats();}
  requestAnimationFrame(frame);
}
function draw(dt){
  var i,j,k,a=0,b=0;
  ctx.clearRect(0,0,W,H);
  for(j=0;j<GH;j++)for(i=0;i<GW;i++){var v=grid[j*GW+i];if(!v)continue;
    if(v===1)a++;else b++;
    ctx.fillStyle=COL[v-1];ctx.globalAlpha=0.55;ctx.fillRect(i*C,j*C,C,C);}
  ctx.globalAlpha=1;
  ctx.strokeStyle='rgba(128,128,128,.12)';ctx.lineWidth=1;ctx.beginPath();
  for(i=0;i<=GW;i++){ctx.moveTo(i*C+.5,0);ctx.lineTo(i*C+.5,H);}
  for(j=0;j<=GH;j++){ctx.moveTo(0,j*C+.5);ctx.lineTo(W,j*C+.5);}
  ctx.stroke();
  var f=1-Math.exp(-dt*14);
  ctx.font='11px system-ui,sans-serif';ctx.textAlign='center';
  for(k in view){var v2=view[k],mine=(k===myId);
    if(mine&&role==='guest'){v2.x=local.x;v2.y=local.y;}
    else{v2.x+=(v2.tx-v2.x)*f;v2.y+=(v2.ty-v2.y)*f;}
    ctx.fillStyle=COL[v2.team]||'#888';ctx.beginPath();ctx.arc(v2.x,v2.y,R,0,6.2832);ctx.fill();
    ctx.lineWidth=mine?3:1.5;ctx.strokeStyle=mine?'#fff':'rgba(0,0,0,.45)';ctx.stroke();
    ctx.fillStyle='#fff';ctx.fillText(v2.bot?'BOT':(v2.name||''),v2.x,v2.y-R-4);
  }
  if(role==='guest'&&ghost){ctx.strokeStyle='#fff';ctx.setLineDash([3,3]);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(ghost.x,ghost.y,R+4,0,6.2832);ctx.stroke();ctx.setLineDash([]);}
  var tot=a+b||1;$('sa').style.width=(a/tot*100)+'%';$('sb').style.width=(b/tot*100)+'%';
}
function stats(){
  $('sRtt').textContent=role==='host'?'0 ms':rttAvg===null?'-':Math.round(rttAvg)+' ms';
  $('sRate').textContent=role==='none'?'-':stRate.toFixed(1);
  $('sErr').textContent=role==='guest'?Math.round(errPx):'-';
  var n=0,bt=0,id;for(id in view){n++;if(view[id].bot)bt++;}
  $('sN').textContent=role==='none'?'-':(n-bt)+'+'+bt;
}
renderReqs();requestAnimationFrame(frame);
})();
</script>
</body>
</html>
